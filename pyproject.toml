[project]
name = "django-dinosaur-game"
version = "1.0.0"
description = "A Django implementation of the offline dinosaur game."
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "gunicorn>=23.0,<24.0",
    "whitenoise>=6.9,<7.0",
    "dj-database-url>=2.3,<3.0",
    "psycopg2-binary>=2.9,<3.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
