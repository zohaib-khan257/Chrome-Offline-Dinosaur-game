{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A Django recreation of the Chrome offline dinosaur game.">
  <title>{% block title %}Django Dino Run{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/game.css' %}">
</head>
<body>
  {% block content %}{% endblock %}
  <script src="{% static 'js/game.js' %}" defer></script>
</body>
</html>
